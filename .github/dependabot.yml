version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    target-branch: main
    open-pull-requests-limit: 10
    groups:
      # Security fixes are separated from routine version bumps deliberately.
      # A single group covering everything produced one all-or-nothing pull
      # request per week -- #15 bundled 103 updates, including the paramiko
      # advisory fix, and sat unreviewed from 2026-07-27 because there was no
      # way to take the security change without the maintenance churn.
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-maintenance:
        applies-to: version-updates
        patterns: ["*"]
        # These two cannot be taken as version bumps. Both break
        # apps/common/utils/encode.py at import time -- itsdangerous 2.x
        # removed the JWS serializers `Signer` is built on, and paramiko 5.0.0
        # removed DSSKey, which the module names at import scope. Each needs a
        # source change first, and itsdangerous needs a reader for the old
        # format because `signer.unsign` is the legacy path for encrypted
        # values at rest. Grouped, they held ~100 routine updates behind them:
        # #43 could not go green no matter how often it was rebased.
        # Excluded here so each arrives as its own pull request and the rest of
        # the group stays mergeable. See
        # docs/security/dependency-upgrade-blockers.md.
        exclude-patterns:
          - itsdangerous
          - paramiko
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Istanbul
    target-branch: main
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-maintenance:
        applies-to: version-updates
        patterns: ["*"]
