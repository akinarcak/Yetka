name: Build and Push Base Image

# Inherited from upstream. It publishes to DockerHub and needs
# DOCKERHUB_USERNAME/DOCKERHUB_TOKEN, which this fork does not set, so the
# pull_request trigger only ever produced a failing "build-and-push" check that
# no Yetka release gate depends on. Manual dispatch is kept so the workflow can
# be used again once those credentials exist.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch used to build the base image'
        required: true
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          file: Dockerfile-base
          tags: akinarcak/yetka-core-base:${{ github.sha }}
          context: .
