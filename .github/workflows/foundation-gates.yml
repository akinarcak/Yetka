name: MSP foundation gates

on:
  pull_request:
    paths:
      - components.lock.yml
      - supported-components.json
      - tools/validate_components_lock.py
      - tools/scan_release_artifacts.py
      - tools/tests/test_release_provenance.py
      - tools/tests/test_container_security.py
      - tools/backup_restore_smoke.py
      - tools/tests/test_backup_restore_smoke.py
      - Dockerfile
      - apps/jumpserver/settings/custom.py
      - Dockerfile-base
      - .github/workflows/foundation-gates.yml
      - .github/workflows/release-installer.yml
      - apps/tenants/**
      - apps/jumpserver/settings/base.py
      - apps/jumpserver/urls.py
      - apps/common/apps.py
      - apps/common/ssh.py
      - apps/common/security_config.py
      - apps/common/security_config_tests.py
      - apps/common/permissions.py
      - apps/common/service_signature_tests.py
      - apps/common/ssh_tests.py
      - apps/common/storage/jms_storage/sftp.py
      - apps/assets/automations/ping_gateway/manager.py
      - apps/libs/ansible/modules_utils/remote_client.py
      - apps/ops/ansible/inventory.py
      - config_example.yml
      - apps/ops/celery/__init__.py
      - apps/ops/signal_handlers.py
      - apps/cloud_sync/**
      - apps/terminal/api/session/session.py
      - apps/terminal/tenant_tests.py
      - apps/terminal/tasks.py
      - apps/terminal/recording_tests.py
      - docs/architecture/0001-tenant-workspace-product-language.md
      - docs/security/customer-tenant-isolation.md
      - docs/security/ssh-host-key-policy.md
  push:
    paths:
      - components.lock.yml
      - supported-components.json
      - tools/validate_components_lock.py
      - tools/scan_release_artifacts.py
      - tools/tests/test_release_provenance.py
      - tools/tests/test_container_security.py
      - tools/backup_restore_smoke.py
      - tools/tests/test_backup_restore_smoke.py
      - Dockerfile
      - apps/jumpserver/settings/custom.py
      - Dockerfile-base
      - .github/workflows/foundation-gates.yml
      - .github/workflows/release-installer.yml
      - apps/tenants/**
      - apps/jumpserver/settings/base.py
      - apps/jumpserver/urls.py
      - apps/common/apps.py
      - apps/common/ssh.py
      - apps/common/security_config.py
      - apps/common/security_config_tests.py
      - apps/common/permissions.py
      - apps/common/service_signature_tests.py
      - apps/common/ssh_tests.py
      - apps/common/storage/jms_storage/sftp.py
      - apps/assets/automations/ping_gateway/manager.py
      - apps/libs/ansible/modules_utils/remote_client.py
      - apps/ops/ansible/inventory.py
      - config_example.yml
      - apps/ops/celery/__init__.py
      - apps/ops/signal_handlers.py
      - apps/cloud_sync/**
      - apps/terminal/api/session/session.py
      - apps/terminal/tenant_tests.py
      - apps/terminal/tasks.py
      - apps/terminal/recording_tests.py
      - docs/architecture/0001-tenant-workspace-product-language.md
      - docs/security/customer-tenant-isolation.md
      - docs/security/ssh-host-key-policy.md

permissions:
  contents: read

env:
  LINA_COMMIT: b1bebf07927062a85a6358bc1905d89204625034

jobs:
  lina-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned Yetka Lina source
        uses: actions/checkout@v4
        with:
          repository: akinarcak/Yetka-Lina
          ref: ${{ env.LINA_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - name: Test and build source-level UI policies
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn test:unit --runInBand tests/unit/components/MaintenanceStatus.spec.js tests/unit/components/Page.spec.js tests/unit/store/settings.spec.js tests/unit/utils/yetkaTenant.spec.js
          yarn build:prod

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable component lock
        run: python tools/validate_components_lock.py --lock components.lock.yml
      - name: Run release provenance tests
        run: |
          python -m unittest tools.tests.test_release_provenance -v
          python -m unittest tools.tests.test_container_security -v
          python -m unittest tools.tests.test_backup_restore_smoke -v

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build self-contained Yetka core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: yetka/core:foundation-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root read-only runtime and forbidden paths
        run: |
          test "$(docker image inspect yetka/core:foundation-test --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --mount type=volume,destination=/opt/jumpserver/data \
            --entrypoint /bin/sh yetka/core:foundation-test -c '
              test "$(id -u)" = 10001
              test ! -d /opt/jumpserver/apps/xpack
              touch /opt/jumpserver/data/.write-test
              touch /opt/jumpserver/tmp/.write-test
              test ! -w /opt/jumpserver/apps
            '
      - name: Run customer tenant isolation tests in the built image
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,exec,nosuid,size=256m \
            --mount type=volume,destination=/opt/jumpserver/data \
            --env DB_ENGINE=sqlite3 \
            --env DB_NAME=/tmp/yetka-tests.sqlite3 \
            --env SECRET_KEY=foundation-ci-not-for-production \
            --env BOOTSTRAP_TOKEN=foundation-ci-bootstrap-not-for-production \
            --env DJANGO_SETTINGS_MODULE=jumpserver.settings \
            --workdir /opt/jumpserver/apps \
            --entrypoint /bin/sh \
            yetka/core:foundation-test -c '
              /opt/py3/bin/python -m django makemigrations --check --dry-run tenants cloud_sync
              /opt/py3/bin/python -m django test tenants.tests cloud_sync.tests --verbosity=2
              /opt/py3/bin/python -m django test common.ssh_tests common.security_config_tests common.service_signature_tests common.component_manifest_tests --verbosity=2
              /opt/py3/bin/python -m django test terminal.tenant_tests terminal.recording_tests --verbosity=2
            '
