name: Security maintenance

on:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:
  push:
    # Was [dev], which is an ancestor of main rather than a branch ahead of it,
    # so this trigger had never fired for any dependency change that shipped.
    branches: [main]
    paths: ['pyproject.toml', 'uv.lock', '.github/workflows/security-maintenance.yml']

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Export locked production dependencies
        run: uv export --frozen --no-dev --format requirements-txt --output-file requirements-audit.txt
      # PYSEC-2026-1325 is the Minerva timing attack on P-256 in python-ecdsa
      # (0.* through 0.19.2, CVSS 7.4). Upstream has declared side-channel
      # attacks out of scope and plans no fix, so no upgrade can clear it and
      # leaving it would hold this job permanently red. A control that always
      # fails reports nothing: that is exactly how the filesystem scan sat
      # broken from 2026-07-20 without anyone being able to tell.
      #
      # It is ignored because the vulnerable path is not reachable here. The
      # advisory covers signing, key generation and ECDH through
      # ecdsa.SigningKey.sign_digest(); it states verification is unaffected.
      # In this codebase:
      #   - nothing imports ecdsa directly; there is no SigningKey or
      #     sign_digest call in apps/ or tools/;
      #   - it arrives through sshpubkeys, which apps/accounts/models/base.py
      #     uses only to parse and inspect public keys;
      #   - the UKey backend refuses ECDSA outright, in
      #     apps/authentication/backends/ukey/api.py and backends.py;
      #   - paramiko.ECDSAKey is paramiko's own class and resolves through
      #     cryptography, not through this library.
      #
      # This exception lapses if anything starts signing with python-ecdsa, or
      # if sshpubkeys gains a signing path. Re-check on any ecdsa version bump.
      - name: Audit Python dependencies
        run: |
          uv tool run pip-audit --requirement requirements-audit.txt \
            --no-deps --disable-pip \
            --ignore-vuln PYSEC-2026-1325

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # trivy-action never completed a single scheduled run: 2026-07-20 and
      # 2026-07-27 failed at job setup, 2026-08-03 and 2026-08-04 failed while
      # its installer downloaded the binary. In every case the "Run Trivy" step
      # was skipped while the job still reported failure, so a control that
      # produced no signal at all looked from the outside like a scan reporting
      # findings. The release workflow scans with a digest-pinned image and has
      # never hit this, so use the same mechanism.
      - name: Scan source and lock files
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/scan:ro" \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 fs /scan \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
