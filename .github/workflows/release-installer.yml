name: Publish Yetka release assets

on:
  push:
    tags: ['yetka-*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new Yetka release tag
        required: true
        default: yetka-1.0.6
      publish_release:
        description: Publish generated assets to a GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  LINA_COMMIT: 41c8b246330d73d63d95723c99828bbb470ba25c
  LUNA_COMMIT: 315f6d26b64e99bb4b749d61a13dc549fbef3a97
  KOKO_COMMIT: 7117df15a1c828929bf6da3a2c07270f4225cff5

jobs:
  release:
    runs-on: ubuntu-latest
    # The job normally finishes in ~10 minutes. Bound it well above that so a
    # genuine hang fails visibly instead of occupying a runner for the 6h default.
    timeout-minutes: 60
    steps:
      - name: Checkout Yetka core
        uses: actions/checkout@v4
        with:
          path: core
      - name: Checkout Yetka Lina
        uses: actions/checkout@v4
        with:
          repository: akinarcak/Yetka-Lina
          ref: ${{ env.LINA_COMMIT }}
          path: lina
      - name: Checkout Yetka Luna
        uses: actions/checkout@v4
        with:
          repository: akinarcak/Yetka-Luna
          ref: ${{ env.LUNA_COMMIT }}
          path: luna
      - name: Checkout Yetka Koko
        uses: actions/checkout@v4
        with:
          repository: akinarcak/Yetka-Koko
          ref: ${{ env.KOKO_COMMIT }}
          path: koko
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version-file: koko/go.mod
          cache-dependency-path: koko/go.sum
      - name: Enable Yarn
        run: corepack enable
      - name: Validate installer scripts
        working-directory: core
        run: find deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate component lock and provenance tests
        working-directory: core
        run: |
          python tools/validate_components_lock.py \
            --lock components.lock.yml --checkout-root ..
          python -m unittest tools.tests.test_release_provenance \
            tools.tests.test_editable_packaging -v
      - name: Verify editable installation matches the release updater
        # Reproduces deploy/yetka-update.sh: a flat-layout discovery failure here
        # previously aborted live deployments and forced a rollback.
        timeout-minutes: 15
        run: |
          set -eux
          python -m pip install --quiet uv
          uv venv --python 3.14 /tmp/pkgcheck-venv
          # A live host also has the runtime tmp/ directory that holds service
          # PID files, and data/ is populated. A bare checkout does not, so
          # recreate them here: their presence is what makes setuptools'
          # flat-layout fallback fire, and a check without them is not
          # representative of the machine the updater actually runs on.
          mkdir -p core/tmp core/data
          uv pip install --python /tmp/pkgcheck-venv/bin/python --no-deps -e core
          # The flat-layout directories must not have been claimed as packages.
          site_packages="$(/tmp/pkgcheck-venv/bin/python -c 'import sysconfig;print(sysconfig.get_paths()["purelib"])')"
          for name in apps data deploy tmp; do
            if [ -e "$site_packages/$name" ]; then
              echo "Flat-layout directory '$name' was installed as a package" >&2
              exit 1
            fi
          done
      - name: Scan core source for high and critical vulnerabilities
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/core:/scan:ro" \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 fs /scan \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Scan core history for leaked secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/core:/repo:ro" \
            zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 detect \
            --source /repo --no-git --redact --exit-code 1
      - name: Build release container for security scan
        # This build takes ~90s. Earlier release attempts were cancelled by hand
        # around the 1-2 minute mark because the default buildkit output prints
        # nothing while long RUN layers execute, which read as a stall. Plain
        # progress keeps the log advancing and the timeout bounds a real hang.
        timeout-minutes: 20
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          docker build --progress=plain \
            --file core/Dockerfile --tag yetka/core:release-scan core
      - name: Scan release container for high and critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image yetka/core:release-scan \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Build Lina
        working-directory: lina
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          yarn install --frozen-lockfile
          yarn test:unit --runInBand tests/unit/components/MaintenanceStatus.spec.js tests/unit/components/Page.spec.js tests/unit/store/settings.spec.js tests/unit/utils/yetkaTenant.spec.js
          yarn build:prod
      - name: Build Luna
        working-directory: luna
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: Build Koko
        working-directory: koko
        run: |
          yarn --cwd ui install --frozen-lockfile
          yarn --cwd ui build
          mkdir -p build
          VERSION="$RELEASE_TAG" make -B build
      - name: Package release assets
        run: |
          mkdir -p artifacts/koko-package/locale
          test -f lina/LICENSE
          cp lina/LICENSE lina/lina/LICENSE
          test -f luna/LICENSE
          cp luna/LICENSE luna/dist/luna/LICENSE
          tar -C lina/lina -czf "artifacts/lina-${RELEASE_TAG}.tar.gz" .
          tar -C luna/dist/luna -czf "artifacts/luna-${RELEASE_TAG}.tar.gz" .
          cp koko/build/koko artifacts/koko-package/koko
          cp koko/README.md koko/LICENSE koko/config_example.yml koko/entrypoint.sh artifacts/koko-package/
          cp -r koko/locale/. artifacts/koko-package/locale/
          tar -C artifacts/koko-package -czf "artifacts/koko-${RELEASE_TAG}-linux-amd64.tar.gz" .
          tar -C core --create --gzip --file "artifacts/yetka-installer-${RELEASE_TAG}.tar.gz" deploy
          python core/tools/scan_release_artifacts.py artifacts/*.tar.gz
          python core/tools/validate_release_licenses.py \
            --lock core/components.lock.yml \
            artifacts/lina-*.tar.gz artifacts/luna-*.tar.gz artifacts/koko-*.tar.gz
          python core/tools/validate_components_lock.py \
            --lock core/components.lock.yml \
            --artifacts-dir artifacts \
            --release-tag "$RELEASE_TAG" \
            --core-commit "$(git -C core rev-parse HEAD)" \
            --output artifacts/components.release.json
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          while read -r hash file; do printf '%s  %s\n' "$hash" "$file" > "$file.sha256"; done < SHA256SUMS
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: artifacts
          format: cyclonedx-json
          output-file: artifacts/yetka-${{ env.RELEASE_TAG }}.sbom.cdx.json
          artifact-name: yetka-${{ env.RELEASE_TAG }}.sbom.cdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign and verify release checksums
        run: |
          cosign sign-blob --yes --output-signature artifacts/SHA256SUMS.sig \
            --bundle artifacts/SHA256SUMS.sigstore.json artifacts/SHA256SUMS
          cosign verify-blob --bundle artifacts/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp 'https://github.com/.*/.github/workflows/.*' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            artifacts/SHA256SUMS
      - name: Attach assets to Yetka release
        if: ${{ success() && (inputs.publish_release == true || (startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'refs/tags/yetka-rehearsal-') == false)) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Yetka ${RELEASE_TAG#yetka-}" --generate-notes
          gh release upload "$RELEASE_TAG" artifacts/*.tar.gz artifacts/*.sha256 artifacts/SHA256SUMS artifacts/SHA256SUMS.sig artifacts/SHA256SUMS.sigstore.json artifacts/*.sbom.cdx.json \
            artifacts/components.release.json \
            --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: yetka-${{ env.RELEASE_TAG }}
          path: artifacts/
          if-no-files-found: error
